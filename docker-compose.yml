# Sandbox Console — Docker Compose
#
# Port configuration:
#   Set EXPLORER_PORT in .env or shell environment to change the container's
#   internal port.  The host-side port defaults to the same value.
#
#   Example:  EXPLORER_PORT=3000  →  container listens on 3000, host maps 3000:3000
#
#   To use a different host port, override the left side of the mapping:
#   ports:
#     - "8088:9090"

services:
  sandbox-console:
    # Use pre-built image from Docker Hub (uncomment for production):
    # image: sandboxconsole/sandbox-console:latest
    # Or build from source:
    build:
      context: ..
      dockerfile: sandbox-console/docker/Dockerfile
    ports:
      - "${EXPLORER_PORT:-9090}:${EXPLORER_PORT:-9090}"
    volumes:
      - sandbox-console-data:/data
    environment:
      - EXPLORER_MASTER_KEY=${EXPLORER_MASTER_KEY:-}
      - EXPLORER_ADMIN_TOKEN=${EXPLORER_ADMIN_TOKEN:-}
      - EXPLORER_PORT=${EXPLORER_PORT:-9090}
      - EXPLORER_HOST=0.0.0.0
      - EXPLORER_PUBLIC_URL=${EXPLORER_PUBLIC_URL:-http://localhost:9090}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, os; urllib.request.urlopen(f'http://localhost:{os.environ.get(\"EXPLORER_PORT\", \"9090\")}/healthz')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  sandbox-console-data:
